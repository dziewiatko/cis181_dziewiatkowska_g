<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS 181 Form Demo</title>
    <link rel="stylesheet" href="forms-student.css">
</head>

<body>
    <main>
        <h1>CIS 181 Course Interest Form</h1>

        <p>
            This sample form shows how a website can collect information from
            visitors. Each form control has a label so users know what to enter.
        </p>

        <!--
            action="#" keeps this classroom demo on the same page.
            A real website would send the form data to a server for processing.
        -->
        <form>
            <fieldset>
            <legend>Contant Info</legend>

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" placeholder="first name here">

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" placeholder="last name here">

            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <select id="stuff" name="stuff">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <p>Learning</p>
            <input type="radio" id="inperson" name="learning" value="inperson"/>
            <label for="inperson">In Person</label>
            <input type="radio" id="online" name="learning" value="online"/>
            <label for="online">Online</label>

            <checkbox 

            
            </fieldset>
        </form>
    </main>
</body>
</html>
